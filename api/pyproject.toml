[project]
name = "safepulse-api"
version = "0.1.0"
description = "SafePulse road-hazard intelligence backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<0.120",
    "uvicorn[standard]>=0.30,<0.40",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "sqlmodel>=0.0.22,<0.1",
    "google-genai>=0.3",
    "rapidfuzz>=3.9,<4",
    "httpx>=0.27,<0.29",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2,<9",
    "ruff>=0.6,<1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008: Depends() in defaults is the canonical FastAPI idiom.
# UP042: str+Enum mix is intentional for SQLModel/pydantic serialization.
ignore = ["B008", "UP042"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
